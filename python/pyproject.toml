[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ransac-wv-calib"
version = "0.2.0"
description = "Standalone DTW and RANSAC spectral wavelength calibration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
fits = ["astropy>=5.3"]
notebook = ["jupyterlab>=4", "matplotlib>=3.7", "scipy>=1.10"]

[project.scripts]
ransac-wv-calib = "ransac_wv_calib.__main__:main"

[tool.setuptools.packages.find]
include = ["ransac_wv_calib*"]
